name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    env:
      DATABASE_URL: mongodb://example.invalid/kabadiwala
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run db:generate
      - run: npx prisma validate
      - run: npm run build
      - run: npm test
  backend-container:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file backend/Dockerfile --tag kabadiwala-connect-backend:ci backend
  android-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: android_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-37"
      - run: chmod +x gradlew
      - name: Restore protected signing keystore
        env:
          PRODUCTION_KEYSTORE_BASE64: ${{ secrets.PRODUCTION_KEYSTORE_BASE64 }}
        run: |
          test -n "$PRODUCTION_KEYSTORE_BASE64"
          echo "$PRODUCTION_KEYSTORE_BASE64" | base64 --decode > production-release.keystore
      - name: Build signed production bundle
        env:
          ORG_GRADLE_PROJECT_productionSigningStoreFile: ${{ github.workspace }}/android_app/production-release.keystore
          ORG_GRADLE_PROJECT_productionSigningStorePassword: ${{ secrets.PRODUCTION_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_productionSigningKeyAlias: ${{ secrets.PRODUCTION_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_productionSigningKeyPassword: ${{ secrets.PRODUCTION_KEY_PASSWORD }}
          PRODUCTION_API_BASE_URL: ${{ secrets.PRODUCTION_API_BASE_URL }}
        run: |
          test -n "$PRODUCTION_API_BASE_URL"
          ./gradlew bundleRelease --no-daemon \
            -PproductionApiBaseUrl="$PRODUCTION_API_BASE_URL" \
            -PrequireProductionSigning=true
      - name: Upload signed production bundle
        uses: actions/upload-artifact@v4
        with:
          name: kabadiwala-connect-production-aab-${{ github.sha }}
          path: android_app/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f production-release.keystore
